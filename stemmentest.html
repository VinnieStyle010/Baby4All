<!DOCTYPE html>
<html lang="nl">
<head>

<style>

<body>
<main>
<h1>🎤 Stemmen testen</h1>
<p>Ontdek hoe onze personages klinken!</p>

</button>
<button onclick="K4AVoices.speak('lila','Hoi! Ik ben Lila! Wat leuk dat je er bent!')">
🐰 Luister naar Lila
</button>

🔇 Stop met praten
</button>

<script src="assets/js/characters/voice-engine.js"></script>
